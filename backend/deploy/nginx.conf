# /etc/nginx/sites-available/y2markets  (certbot adds the HTTPS server block and redirects)
server {
    listen 80;
    server_name y2markets.site www.y2markets.site;

    root /var/www/y2markets;
    index index.html;
    client_max_body_size 10m;   # KYC uploads (8 MB limit in the API)

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (WebSocket upgrade)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Long-cache hashed assets, never cache index.html
    location ~* \.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
