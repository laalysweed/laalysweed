# MongoDB single-node replica set (rs0) — transactions require a replica set.
# Start:  docker compose up -d
# URI:    mongodb://localhost:27017/y2markets?replicaSet=rs0&directConnection=true
services:
  mongo:
    image: mongo:7.0
    container_name: y2-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - y2-mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
    restart: unless-stopped
volumes:
  y2-mongo-data:
